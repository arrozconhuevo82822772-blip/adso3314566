<body>
    <a class="btn-home" href="index.html">
        <svg class="SVGBGI" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path class="accent" d="M12 20V4l-8 8 8 8z"></path><path class="outline" d="m2.29,12.71l8,8c.39.39,1.02.39,1.41,0s.39-1.02,0-1.41l-6.29-6.29h15.59c.55,0,1-.45,1-1s-.45-1-1-1H5.41l6.29-6.29c.39-.39.39-1.02,0-1.41-.2-.2-.45-.29-.71-.29s-.51.1-.71.29L2.29,11.29c-.39.39-.39,1.02,0,1.41Z"></path><path class="solid" d="m1.58 13.42 8 8a2 2 0 0 0 2.83-2.83L7.82 14h13.17c1.1 0 2-.9 2-2s-.9-2-2-2H7.83l4.59-4.59a2 2 0 0 0-1.41-3.42 2 2 0 0 0-1.41.59l-8.02 8a2.01 2.01 0 0 0 0 2.83Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>02 - Comments</h1>
            <h2>Add comments to explain or annotate your code.</h2>
        </header>
        <section>
            <div class="recuadro">
                <h3>Digital Time</h3>
                <h2 id="time">00:00:00</h2>
            </div>
        </section>
    </main>
    <script>
        // This is a line comment
        const time = document.getElementById('time')
        // Add some styles
        time.style.textAlign = 'center';
        time.style.zoom = '3.4';
        /*
            This is a block coment.
            Its used to multiple lines of code
            or inactive large portions of code
        */

        // This is a interval time
        setInterval(function () {
            let today = new Date;           // New Date
            let hours = today.getHours();   // Get Hours
            let minutes = today.getMinutes(); // Get Minutes
            let seconds = today.getSeconds(); // Get seconds
            // Show time
            time.textContent = `${hours.toString().padStart(2, '00')}:${minutes.toString().padStart(2, '00')}:${seconds.toString().padStart(2, '00')}`;
        }, 1000)
    </script>
</body>

</html>
