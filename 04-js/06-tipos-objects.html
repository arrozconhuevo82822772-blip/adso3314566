<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../src/css/04-js.css">
</head>
<body>
    <a class="btn-home" href="../04-js/index.html">
        <svg class="SVGBGI" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path class="accent" d="M12 20V4l-8 8 8 8z"></path><path class="outline" d="m2.29,12.71l8,8c.39.39,1.02.39,1.41,0s.39-1.02,0-1.41l-6.29-6.29h15.59c.55,0,1-.45,1-1s-.45-1-1-1H5.41l6.29-6.29c.39-.39.39-1.02,0-1.41-.2-.2-.45-.29-.71-.29s-.51.1-.71.29L2.29,11.29c-.39.39-.39,1.02,0,1.41Z"></path><path class="solid" d="m1.58 13.42 8 8a2 2 0 0 0 2.83-2.83L7.82 14h13.17c1.1 0 2-.9 2-2s-.9-2-2-2H7.83l4.59-4.59a2 2 0 0 0-1.41-3.42 2 2 0 0 0-1.41.59l-8.02 8a2.01 2.01 0 0 0 0 2.83Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>06-Type Object</h1>
            <h2>Understand and work with different object types</h2>
        </header>
        <section>
            <div class="recuadro">
                <h3>Object Types</h3>
            <ul class="objects"></ul>
        </section>
    </main>
    <script>
        //Elements
        const objs = document.querySelector('.objects');

        //Object String
        const string = new String('Javascript🧟');
        objs.innerHTML = `<li>${string} - Object: ${string.constructor.name}</li>`;

        //Object Number
        const number = new Number(256);
        objs.innerHTML += `<li>${number} - Object: ${number.constructor.name}</li>`;

        //object Boolean
        const bool = new Boolean(512>128);
        objs.innerHTML += `<li>${bool} - Object: ${bool.constructor.name}</li>`;

        //Object Array
        const array = new Array('🚕','🚑','🏍️','👨‍🦽‍➡️','🚁');
        objs.innerHTML += `<li>${array} - Object: ${array.constructor.name}</li>`;

        //Object Date
        const dt = new Date('06/08/2026');
        objs.innerHTML += `<li>${dt.getFullYear()} - Object: ${dt.constructor.name}</li>`;

        //object object
        const obj = new Object('Vehicle');
        objs.innerHTML += `<li>${obj} - Object: ${obj.constructor.name}</li>`;
    </script>
</body>
</html>
