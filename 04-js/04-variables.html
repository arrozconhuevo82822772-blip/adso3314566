<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04 - Variables</title>
    <link rel="stylesheet" href="../src/css/04-js.css">
</head>
<body>
    <a class="btn-home" href="index.html">
        <svg class="SVGBGI" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path class="accent" d="M12 20V4l-8 8 8 8z"></path><path class="outline" d="m2.29,12.71l8,8c.39.39,1.02.39,1.41,0s.39-1.02,0-1.41l-6.29-6.29h15.59c.55,0,1-.45,1-1s-.45-1-1-1H5.41l6.29-6.29c.39-.39.39-1.02,0-1.41-.2-.2-.45-.29-.71-.29s-.51.1-.71.29L2.29,11.29c-.39.39-.39,1.02,0,1.41Z"></path><path class="solid" d="m1.58 13.42 8 8a2 2 0 0 0 2.83-2.83L7.82 14h13.17c1.1 0 2-.9 2-2s-.9-2-2-2H7.83l4.59-4.59a2 2 0 0 0-1.41-3.42 2 2 0 0 0-1.41.59l-8.02 8a2.01 2.01 0 0 0 0 2.83Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>04 - Data Types</h1>
            <h2>Store and manage data using variables.</h2>
        </header>
        <section>
            <div class="recuadro">
                <h3>Type String:    <small class="type-string"></small></h3>
                <h3>Type Number:    <small class="type-number"></small></h3>
                <h3>Type Boolean:   <small class="type-boolean"></small></h3>
                <h3>Type Null:      <small class="type-null"></small></h3>
                <h3>Type Undefined: <small class="type-undefined"></small></h3>
                <h3>Type Array:     <small class="type-array"></small></h3>
                <h3>Type Object:    <small class="type-object"></small></h3>
            </div>
        </section>
    </main>
    <script>
        // Type String
        const tstring = document.querySelector('.type-string');
        const message = 'Hello JS';
        tstring.textContent = `${message} -> Length:
                                ${message.length} characters`;

        // Type Number
        const tnumber = document.querySelector('.type-number');
        const num1 = '45';
        const num2 = 12.4;
        tnumber.textContent = `(45+12.4) -> ${parseInt(num1)+num2}`;

        // Type Boolean
        const tboolean = document.querySelector('.type-boolean')
        const isTrue = (4>8);
        tboolean.textContent = `(4>8) -> ${isTrue}`

        // Type Null
        const tnull = document.querySelector('.type-null')
        const isCreated = null;
        tnull.textContent = `isCreated -> ${isCreated}`

        // Type Undefined
        const tundefined = document.querySelector('.type-undefined');
        const isBinary = undefined;
        tundefined.textContent = `isBinary -> ${isBinary}`

        // Type Array
        const tarray = document.querySelector('.type-array');
        const landscapes = ['🏞️', ' 🌄', ' 🏔️', ' 🌅', ' 🏝️'];
        tarray.textContent = `Landscapes -> ${landscapes}`

        // Type Object
        const tobject = document.querySelector('.type-object');
        const hashira = {
            name: 'Kyojuro Rengoku',
            type: 'Fire',
            age: 24
        }
        tobject.textContent = `Hashira -> ${hashira.name}, ${hashira.type}, ${hashira.age} years old`;
        
    </script>
</body>
</html>
