<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07-Vehicle - Class</title>
    <link rel="stylesheet" href="../src/css/04-js.css">
    <style>
        * { box-sizing: border-box; }

        .btn-home {
            position: fixed;
            top: 20px; left: 20px;
            width: 72px; height: 72px;
            display: flex; align-items: center; justify-content: center;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            z-index: 1000;
            transition: transform .2s ease;
        }
        .btn-home:hover { transform: scale(1.05); }
        .btn-home svg { width: 42px; height: 42px; }

        #vehicle {
            --card-bg: #ffffff;
            --ink: #13171a;
            --ink-soft: #6b7683;
            --accent: #bb0a30;
            --box-bg: #f7f8fa;
            --box-border: #d9dde2;
            --shadow: 0 18px 40px rgba(19,23,26,.10);
            --scene-sky: url('./src/css/imgs/Landscape.png') center/cover no-repeat;
            --scene-road: #2b2f36;
            --logo: url('./src/css/imgs/logo\ dia.png');
            --logo-size: 120px;
            --active-bg: rgba(187, 10, 48, 0.15);
            --active-border: rgba(187, 10, 48, 0.6);
            color: var(--ink);
            width: 380px;
            max-width: 100%;
            margin: 40px auto;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px;
            box-shadow: var(--shadow);
            transition: background .35s ease, color .35s ease;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            position: relative;
        }

        #vehicle.dark {
            --card-bg: #0e1318;
            --ink: #f4f6f8;
            --ink-soft: #8a949e;
            --accent: #e8324f;
            --box-bg: #161b22;
            --box-border: #232a33;
            --shadow: 0 18px 40px rgba(0,0,0,.6);
            --scene-sky: url('./src/css/imgs/Rectangle\ 12.png') center/cover no-repeat;
            --scene-road: #1a1e24;
            --logo: url('./src/css/imgs/logo\ noche.png');
            --logo-size: 150px;
            --active-bg: rgba(232, 50, 79, 0.25);
            --active-border: rgba(232, 50, 79, 0.7);
        }

        #vehicle > header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }
        .logo {
            width: var(--logo-size);
            height: 55px;
            background-image: var(--logo);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: left center;
            transition: width .35s ease;
        }
        button.mode {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid var(--box-border);
            background: var(--box-bg);
            color: var(--ink);
            cursor: pointer;
            transition: transform .2s ease, border-color .2s ease;
        }
        button.mode:hover { transform: translateY(-1px); border-color: var(--accent); }
        button.mode svg { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        nav.selector {
            display: grid;
            grid-template-columns: 70px 1fr 70px;
            gap: 8px;
            margin-bottom: 14px;
        }
        button.nav-arrow {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 8px 6px;
            border-radius: 14px;
            font-size: .65rem;
            font-weight: 700;
            border: 1px solid var(--box-border);
            background: var(--box-bg);
            color: var(--ink);
            cursor: pointer;
            transition: transform .2s ease, border-color .2s ease;
        }
        button.nav-arrow:hover { transform: translateY(-1px); border-color: var(--accent); }
        button.nav-arrow svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            border: 1px solid var(--box-border);
            background: var(--box-bg);
            border-radius: 14px;
            padding: 12px 8px;
            color: var(--ink);
        }

        .specs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .spec-box {
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 14px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 62px;
        }
        .spec-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }
        .spec-label { margin: 0; font-size: .7rem; font-weight: 800; color: var(--ink); letter-spacing: .3px; }
        .spec-head svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .spec-value { margin: 0; font-size: .85rem; font-weight: 700; color: var(--accent); }

        .scene-container {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            background: var(--scene-sky);
            transition: background .35s ease;
        }
        .road {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 30%;
            background: var(--scene-road);
            z-index: 1;
        }
        .road::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0; right: 0;
            height: 4px;
            background-image: repeating-linear-gradient(90deg, #f7c948 0 25px, transparent 25px 50px);
            transform: translateY(-50%);
            background-position-x: 0;
        }
        .scene-container.is-forward .road::before { animation: road-move .35s linear infinite; }
        .scene-container.is-back .road::before { animation: road-move-rev .5s linear infinite; }
        @keyframes road-move { from { background-position-x: 0; } to { background-position-x: -50px; } }
        @keyframes road-move-rev { from { background-position-x: 0; } to { background-position-x: 50px; } }

        .car-wrapper {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            height: 50%;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            transition: transform .5s ease;
            transform-origin: center bottom;
        }
        .car-img {
            height: 90%;
            width: auto;
            max-width: 100%;
            object-fit: contain;
        }
        @keyframes car-bob {
            0%   { transform: translateX(-50%) translateY(0); }
            50%  { transform: translateX(-50%) translateY(-3px); }
            100% { transform: translateX(-50%) translateY(0); }
        }
        .car-wrapper.is-running { animation: car-bob .35s ease-in-out infinite; }
        .car-wrapper.is-reverse { transform: translateX(-50%) scaleX(-1); }
        @keyframes car-shake {
            0% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(1.2deg); }
            50% { transform: translateX(-50%) rotate(-1.2deg); }
            75% { transform: translateX(-50%) rotate(0.6deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }
        .car-wrapper.is-starting { animation: car-shake 0.12s linear infinite; }

        menu {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin: 14px 0 0;
            padding: 0;
            list-style: none;
            width: 100%;
        }
        menu button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 4px;
            border-radius: 12px;
            font-size: .68rem;
            font-weight: 700;
            border: 1px solid var(--box-border);
            background: var(--box-bg);
            color: var(--ink);
            cursor: pointer;
            transition: transform .18s ease, border-color .25s ease, background .25s ease;
        }
        menu button:hover { transform: translateY(-1px); border-color: var(--accent); }
        menu button svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        menu button.active { background: var(--active-bg); border-color: var(--active-border); }
        menu button.active svg { stroke: var(--accent); }
        menu button.power svg { stroke: #d32f2f; }
        menu button.power:hover { border-color: #d32f2f; }

        .log-box {
            margin-top: 12px;
            padding: 8px 10px;
            border-radius: 10px;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            font-size: .68rem;
            color: var(--ink-soft);
            min-height: 18px;
        }

        /* 🔥 KILL SWITCH (solo para el coche) */
        .car-wrapper,
        .car-wrapper *,
        .car-img,
        #carImg {
            mask: none !important;
            -webkit-mask: none !important;
            mask-image: none !important;
            -webkit-mask-image: none !important;
            clip-path: none !important;
            -webkit-clip-path: none !important;
            box-shadow: none !important;
            text-shadow: none !important;
            mix-blend-mode: normal !important;
            outline: none !important;
            border: none !important;
        }
    </style>
</head>
<body>
    <a class="btn-home" href="index.html" aria-label="Home">
        <svg class="SVGBGI" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path class="accent" fill="#bb0a30" d="M12 20V4l-8 8 8 8z"></path><path class="solid" fill="#13171a" d="m1.58 13.42 8 8a2 2 0 0 0 2.83-2.83L7.82 14h13.17c1.1 0 2-.9 2-2s-.9-2-2-2H7.83l4.59-4.59a2 2 0 0 0-1.41-3.42 2 2 0 0 0-1.41.59l-8.02 8a2.01 2.01 0 0 0 0 2.83Z"></path></svg>
    </a>
    <main>
        <header style="text-align:center;margin-top:20px">
            <h1>07-Vehicle - Class</h1>
            <h2>A Vehicle class models each car: its data (brand, model, year, color, top speed) and its behavior (turn on/off, accelerate, brake, reverse, honk).</h2>
        </header>
        <section>
            <div id="vehicle">
                <header>
                    <div class="logo" aria-label="Audi Logo"></div>
                    <button class="mode" id="modeToggle" aria-label="Toggle dark/light mode">
                        <svg id="modeIcon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4.5"></circle>
                            <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path>
                        </svg>
                        <span>MODE</span>
                    </button>
                </header>

                <nav class="selector">
                    <button class="nav-arrow" id="prevBtn" aria-label="Previous car">
                        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                        <span>Prev</span>
                    </button>
                    <div class="brand" id="brandName">Audi</div>
                    <button class="nav-arrow" id="nextBtn" aria-label="Next car">
                        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                        <span>next</span>
                    </button>
                </nav>

                <div class="specs">
                    <div class="spec-box">
                        <div class="spec-head">
                            <p class="spec-label">Model</p>
                            <svg viewBox="0 0 24 24">
                                <path d="M5 17h14M5 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm14 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/>
                                <path d="M5 17l2-7h10l2 7"/>
                                <path d="M9 10V7h6v3"/>
                            </svg>
                        </div>
                        <p class="spec-value" id="specModel">R8</p>
                    </div>
                    <div class="spec-box">
                        <div class="spec-head">
                            <p class="spec-label">Refer</p>
                            <svg viewBox="0 0 24 24">
                                <path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 1 5.4-5.4l-2.5 2.5 1.5 1.5 2.5-2.5z"/>
                            </svg>
                        </div>
                        <p class="spec-value" id="specYear">2024</p>
                    </div>
                    <div class="spec-box">
                        <div class="spec-head">
                            <p class="spec-label">Color</p>
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.56-2.5 5.56-5.55C21.97 6.01 17.46 2 12 2z"/>
                                <circle cx="13.5" cy="6.5" r=".8" fill="currentColor"/>
                                <circle cx="17.5" cy="10.5" r=".8" fill="currentColor"/>
                                <circle cx="8.5" cy="7.5" r=".8" fill="currentColor"/>
                                <circle cx="6.5" cy="12.5" r=".8" fill="currentColor"/>
                            </svg>
                        </div>
                        <p class="spec-value" id="specColor">White</p>
                    </div>
                </div>

                <div class="scene-container" id="scene">
                    <div class="road"></div>
                    <div class="car-wrapper" id="carWrapper">
                        <img class="car-img" id="carImg" src="" alt="Selected car">
                    </div>
                </div>

                <menu>
                    <button id="menuOn" title="Turn on engine">
                        <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4z"/></svg>
                        <span>On</span>
                    </button>
                    <button id="menuForward" title="Accelerate">
                        <svg viewBox="0 0 24 24"><path d="M4 6l8 6-8 6V6z"/><path d="M12 6l8 6-8 6V6z"/></svg>
                        <span>Forw</span>
                    </button>
                    <button id="menuStop" title="Brake">
                        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
                        <span>Stop</span>
                    </button>
                    <button id="menuReverse" title="Reverse">
                        <svg viewBox="0 0 24 24"><path d="M20 6l-8 6 8 6V6z"/><path d="M12 6l-8 6 8 6V6z"/></svg>
                        <span>Back</span>
                    </button>
                    <button id="menuOff" class="power" title="Turn off engine">
                        <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
                        <span>Off</span>
                    </button>
                </menu>

                <div class="log-box" id="logBox">Ready. Select a car and press On to start the engine.</div>
            </div>
        </section>
    </main>

    <script>
        class Vehicle {
            constructor(brand, model, year, color, topSpeed, img, engineType) {
                this.brand = brand;
                this.model = model;
                this.year = year;
                this.color = color;
                this.topSpeed = topSpeed;
                this.img = img;
                this.engineType = engineType;
                this.engineOn = false;
                this.speed = 0;
                this.direction = 'stopped';
            }
            turnOn() { this.engineOn = true; this.speed = 0; this.direction = 'idle'; return `${this.brand} ${this.model} engine started.`; }
            turnOff() { this.engineOn = false; this.speed = 0; this.direction = 'stopped'; return `${this.brand} ${this.model} engine turned off.`; }
            accelerate() { if (!this.engineOn) return `Turn the engine on first.`; this.direction = 'forward'; this.speed = this.topSpeed; return `${this.model} accelerating forward.`; }
            reverse() { if (!this.engineOn) return `Turn the engine on first.`; this.direction = 'reverse'; this.speed = Math.round(this.topSpeed * 0.5); return `${this.model} reversing.`; }
            brake() { if (!this.engineOn) return `Engine is already off.`; this.direction = 'idle'; this.speed = 0; return `${this.model} braking to a stop.`; }
            describe() { return `${this.year} ${this.brand} ${this.model} (${this.color})`; }
        }

        const fleet = [
            new Vehicle('Audi', 'R8',    2024, 'Glacier White',  330, './src/css/imgs/audi-r8.png',    'brutal'),
            new Vehicle('Audi', 'RS3',   2024, 'Nardo Grey',     290, './src/css/imgs/audi-rs3.png',   'normal'),
            new Vehicle('Audi', 'RS7',   2024, 'District Green', 305, './src/css/imgs/audi-rs7.png',   'brutal'),
            new Vehicle('Audi', 'TT RS', 2024, 'Sepang Blue',    280, './src/css/imgs/audi-tt.png',    'normal'),
            new Vehicle('Audi', 'RS Q8', 2024, 'Daytona Grey',   250, './src/css/imgs/audi-rsq8.png',  'brutal')
        ];

        let current = 0;

        const vhc = document.getElementById('vehicle');
        const modeToggle = document.getElementById('modeToggle');
        const modeIcon = document.getElementById('modeIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const brandName = document.getElementById('brandName');
        const specModel = document.getElementById('specModel');
        const specYear = document.getElementById('specYear');
        const specColor = document.getElementById('specColor');
        const carWrapper = document.getElementById('carWrapper');
        const carImg = document.getElementById('carImg');
        const scene = document.getElementById('scene');
        const logBox = document.getElementById('logBox');

        const menuOn = document.getElementById('menuOn');
        const menuOff = document.getElementById('menuOff');
        const menuForward = document.getElementById('menuForward');
        const menuReverse = document.getElementById('menuReverse');
        const menuStop = document.getElementById('menuStop');

        let audioCtx = null;
        let engineNodes = null;
        let masterGain = null;

        function ctx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.5;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function startEngineHum(type) {
            stopEngineHum();
            const c = ctx();
            const osc1 = c.createOscillator();
            const osc2 = c.createOscillator();
            const subOsc = c.createOscillator();

            const noiseBuffer = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
            const noiseData = noiseBuffer.getChannelData(0);
            for (let i = 0; i < noiseData.length; i++) noiseData[i] = Math.random() * 2 - 1;
            const noise = c.createBufferSource();
            noise.buffer = noiseBuffer;
            noise.loop = true;

            const filter = c.createBiquadFilter();
            filter.type = 'lowpass';
            filter.Q.value = 3;

            const gain = c.createGain();
            gain.gain.value = 0;

            const noiseGain = c.createGain();

            if (type === 'brutal') {
                osc1.type = 'sawtooth'; osc1.frequency.value = 38;
                osc2.type = 'square';   osc2.frequency.value = 76;
                subOsc.type = 'sine';   subOsc.frequency.value = 19;
                filter.frequency.value = 600;
                noiseGain.gain.value = 0.02;
                gain.gain.linearRampToValueAtTime(0.12, c.currentTime + 0.4);
            } else {
                osc1.type = 'sawtooth'; osc1.frequency.value = 55;
                osc2.type = 'sine';     osc2.frequency.value = 110;
                subOsc.type = 'sine';   subOsc.frequency.value = 27;
                filter.frequency.value = 1200;
                noiseGain.gain.value = 0.01;
                gain.gain.linearRampToValueAtTime(0.07, c.currentTime + 0.3);
            }

            noise.connect(noiseGain);
            noiseGain.connect(filter);
            osc1.connect(filter);
            osc2.connect(filter);
            subOsc.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);

            osc1.start(); osc2.start(); subOsc.start(); noise.start();
            engineNodes = { osc1, osc2, subOsc, noise, gain, filter, noiseGain, type };
        }

        function setEngineRate(freq) {
            if (!engineNodes) return;
            const c = ctx();
            const t = c.currentTime;
            const isBrutal = engineNodes.type === 'brutal';
            const baseFreq = isBrutal ? freq * 0.7 : freq;
            engineNodes.osc1.frequency.setTargetAtTime(baseFreq, t, 0.15);
            engineNodes.osc2.frequency.setTargetAtTime(baseFreq * 2, t, 0.15);
            engineNodes.subOsc.frequency.setTargetAtTime(baseFreq * 0.5, t, 0.15);
            engineNodes.filter.frequency.setTargetAtTime(isBrutal ? 400 + baseFreq * 3 : 600 + baseFreq * 5, t, 0.15);
            engineNodes.gain.gain.setTargetAtTime(isBrutal ? 0.15 : 0.09, t, 0.2);
        }

        function stopEngineHum() {
            if (engineNodes) {
                const c = ctx();
                const t = c.currentTime;
                try { engineNodes.gain.gain.setTargetAtTime(0, t, 0.1); } catch(e) {}
                const nodes = engineNodes;
                setTimeout(() => {
                    try { nodes.osc1.stop(); } catch(e) {}
                    try { nodes.osc2.stop(); } catch(e) {}
                    try { nodes.subOsc.stop(); } catch(e) {}
                    try { nodes.noise.stop(); } catch(e) {}
                    nodes.osc1.disconnect(); nodes.osc2.disconnect();
                    nodes.subOsc.disconnect(); nodes.noise.disconnect();
                    nodes.gain.disconnect(); nodes.filter.disconnect(); nodes.noiseGain.disconnect();
                }, 150);
                engineNodes = null;
            }
        }

        function log(msg) { logBox.textContent = msg; }
        function setActive(btn) {
            [menuOn, menuForward, menuStop, menuReverse, menuOff].forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }
        function clearSceneState() {
            scene.classList.remove('is-forward', 'is-back');
            carWrapper.classList.remove('is-running', 'is-reverse', 'is-starting');
        }

        function render() {
            const v = fleet[current];
            brandName.textContent = v.brand;
            specModel.textContent = v.model;
            specYear.textContent = v.year;
            specColor.textContent = v.color;
            carImg.src = v.img;
            carImg.alt = v.describe();
            clearSceneState();
            setActive(v.engineOn ? menuOn : null);
            log(`Selected: ${v.describe()}. Top speed ${v.topSpeed} km/h.`);
        }

        menuOn.addEventListener('click', () => {
            const v = fleet[current];
            log(v.turnOn());
            clearSceneState();
            startEngineHum(v.engineType);
            carWrapper.classList.add('is-starting');
            setTimeout(() => carWrapper.classList.remove('is-starting'), 800);
            setActive(menuOn);
        });

        menuOff.addEventListener('click', () => {
            const v = fleet[current];
            log(v.turnOff());
            clearSceneState();
            stopEngineHum();
            setActive(menuOff);
        });

        menuForward.addEventListener('click', () => {
            const v = fleet[current];
            log(v.accelerate());
            if (v.engineOn) {
                clearSceneState();
                scene.classList.add('is-forward');
                carWrapper.classList.add('is-running');
                setEngineRate(v.engineType === 'brutal' ? 120 : 150);
                setActive(menuForward);
            }
        });

        menuReverse.addEventListener('click', () => {
            const v = fleet[current];
            log(v.reverse());
            if (v.engineOn) {
                clearSceneState();
                scene.classList.add('is-back');
                carWrapper.classList.add('is-running', 'is-reverse');
                setEngineRate(70);
                setActive(menuReverse);
            }
        });

        menuStop.addEventListener('click', () => {
            const v = fleet[current];
            log(v.brake());
            clearSceneState();
            if (v.engineOn) setEngineRate(50);
            setActive(v.engineOn ? menuStop : menuOff);
        });

        prevBtn.addEventListener('click', () => {
            fleet[current].turnOff();
            stopEngineHum();
            current = (current - 1 + fleet.length) % fleet.length;
            render();
        });

        nextBtn.addEventListener('click', () => {
            fleet[current].turnOff();
            stopEngineHum();
            current = (current + 1) % fleet.length;
            render();
        });

        function setTheme(isDark) {
            vhc.classList.toggle('dark', isDark);
            modeIcon.innerHTML = isDark
                ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor" stroke="none"></path>'
                : '<circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path>';
        }
        const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
        setTheme(darkQuery.matches);
        darkQuery.addEventListener('change', e => setTheme(e.matches));
        modeToggle.addEventListener('click', () => setTheme(!vhc.classList.contains('dark')));

        render();
    </script>
</body>
</html>
