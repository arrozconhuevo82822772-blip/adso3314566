<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07-Vehicle - Class</title>
    <link rel="stylesheet" href="../src/css/04-js.css">
    <style>
        * { box-sizing: border-box; }

        .btn-home {
            position: fixed;
            top: 20px; left: 20px;
            width: 72px; height: 72px;
            display: flex; align-items: center; justify-content: center;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            z-index: 1000;
            transition: transform .2s ease;
        }
        .btn-home:hover { transform: scale(1.05); }
        .btn-home svg { width: 42px; height: 42px; }

        #vehicle {
            --card-bg: #ffffff;
            --ink: #13171a;
            --ink-soft: #6b7683;
            --accent: #bb0a30;
            --box-bg: #f7f8fa;
            --box-border: #d9dde2;
            --shadow: 0 18px 40px rgba(19,23,26,.10);
            --scene-sky: url('./src/css/imgs/Landscape.png') center/cover no-repeat;
            --scene-road: #2b2f36;
            --logo: url('./src/css/imgs/logo\ dia.png');
            --logo-size: 120px;
            --active-bg: rgba(187, 10, 48, 0.15);
            --active-border: rgba(187, 10, 48, 0.6);
            color: var(--ink);
            width: 420px;
            max-width: 100%;
            margin: 40px auto;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 18px;
            box-shadow: var(--shadow);
            transition: background .35s ease, color .35s ease;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            position: relative;
        }

        #vehicle.dark {
            --card-bg: #0e1318;
            --ink: #f4f6f8;
            --ink-soft: #8a949e;
            --accent: #e8324f;
            --box-bg: #161b22;
            --box-border: #232a33;
            --shadow: 0 18px 40px rgba(0,0,0,.6);
            --scene-sky: url('./src/css/imgs/Rectangle\ 12.png') center/cover no-repeat;
            --scene-road: #1a1e24;
            --logo: url('./src/css/imgs/logo\ noche.png');
            --logo-size: 150px;
            --active-bg: rgba(232, 50, 79, 0.25);
            --active-border: rgba(232, 50, 79, 0.7);
        }

        #vehicle > header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }
        .logo {
            width: var(--logo-size);
            height: 55px;
            background-image: var(--logo);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: left center;
            transition: width .35s ease;
        }
        button.mode {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid var(--box-border);
            background: var(--box-bg);
            color: var(--ink);
            cursor: pointer;
            transition: transform .2s ease, border-color .2s ease;
        }
        button.mode:hover { transform: translateY(-1px); border-color: var(--accent); }
        button.mode svg { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        nav.selector {
            display: grid;
            grid-template-columns: 70px 1fr 70px;
            gap: 8px;
            margin-bottom: 14px;
        }
        button.nav-arrow {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 8px 6px;
            border-radius: 14px;
            font-size: .65rem;
            font-weight: 700;
            border: 1px solid var(--box-border);
            background: var(--box-bg);
            color: var(--ink);
            cursor: pointer;
            transition: transform .2s ease, border-color .2s ease;
        }
        button.nav-arrow:hover { transform: translateY(-1px); border-color: var(--accent); }
        button.nav-arrow svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            border: 1px solid var(--box-border);
            background: var(--box-bg);
            border-radius: 14px;
            padding: 12px 8px;
            color: var(--ink);
        }

        .specs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .spec-box {
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 14px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 62px;
        }
        .spec-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }
        .spec-label { margin: 0; font-size: .7rem; font-weight: 800; color: var(--ink); letter-spacing: .3px; }
        .spec-head svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .spec-value { margin: 0; font-size: .85rem; font-weight: 700; color: var(--accent); }

        .scene-container {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            background: var(--scene-sky);
            transition: background .35s ease;
        }
        .road {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 30%;
            background: var(--scene-road);
            z-index: 1;
        }
        .road::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0; right: 0;
            height: 4px;
            background-image: repeating-linear-gradient(90deg, #f7c948 0 25px, transparent 25px 50px);
            transform: translateY(-50%);
            background-position-x: 0;
        }
        .scene-container.is-forward .road::before { animation: road-move .35s linear infinite; }
        .scene-container.is-back .road::before { animation: road-move-rev .5s linear infinite; }
        @keyframes road-move { from { background-position-x: 0; } to { background-position-x: -50px; } }
        @keyframes road-move-rev { from { background-position-x: 0; } to { background-position-x: 50px; } }

        .car-wrapper {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            height: 50%;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            transition: transform .5s ease;
            transform-origin: center bottom;
        }
        .car-img {
            height: 90%;
            width: auto;
            max-width: 100%;
            object-fit: contain;
        }
        @keyframes car-bob {
            0%   { transform: translateX(-50%) translateY(0); }
            50%  { transform: translateX(-50%) translateY(-3px); }
            100% { transform: translateX(-50%) translateY(0); }
        }
        .car-wrapper.is-running { animation: car-bob .35s ease-in-out infinite; }
        .car-wrapper.is-reverse { transform: translateX(-50%) scaleX(-1); }
        @keyframes car-shake {
            0% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(1.2deg); }
            50% { transform: translateX(-50%) rotate(-1.2deg); }
            75% { transform: translateX(-50%) rotate(0.6deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }
        .car-wrapper.is-starting { animation: car-shake 0.12s linear infinite; }

        /* 🚨 ALARMA */
        @keyframes car-alarm {
            0%   { transform: translateX(-50%) rotate(-2deg); }
            25%  { transform: translateX(-50%) rotate(2deg); }
            50%  { transform: translateX(-50%) rotate(-2deg); }
            75%  { transform: translateX(-50%) rotate(2deg); }
            100% { transform: translateX(-50%) rotate(-2deg); }
        }
        .car-wrapper.is-alarm { animation: car-alarm 0.15s linear infinite; }
        @keyframes flash-lights {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 0 transparent); }
            50%      { filter: brightness(1.4) drop-shadow(0 0 12px #ffd700); }
        }
        .car-img.is-alarm { animation: flash-lights 0.4s ease-in-out infinite; }

        /* 🏎️ DRIFT - El coche SE MUEVE lateralmente por la pantalla */
        @keyframes car-drift {
            0%   { transform: translateX(-50%)  translateY(0)     rotate(0deg)    scale(1); }
            15%  { transform: translateX(-90%)  translateY(-3px)  rotate(-22deg)  scale(1); }
            35%  { transform: translateX(-10%)  translateY(-3px)  rotate(20deg)   scale(1); }
            55%  { transform: translateX(-85%)  translateY(-3px)  rotate(-18deg)  scale(1); }
            75%  { transform: translateX(-15%)  translateY(-3px)  rotate(15deg)   scale(1); }
            100% { transform: translateX(-50%)  translateY(0)     rotate(0deg)    scale(1); }
        }
        .car-wrapper.is-drift { animation: car-drift 2.2s ease-in-out; }

        /* 🔥 NITRO - El coche sale disparado hacia adelante con fuego */
        @keyframes car-nitro {
            0%   { transform: translateX(-50%)  translateY(0)    scale(1); }
            15%  { transform: translateX(20%)   translateY(-2px) scale(1.05); }
            40%  { transform: translateX(120%)  translateY(-2px) scale(0.9); }
            60%  { transform: translateX(-250%) translateY(-2px) scale(0.9); }
            80%  { transform: translateX(-50%)  translateY(-2px) scale(1); }
            100% { transform: translateX(-50%)  translateY(0)    scale(1); }
        }
        .car-wrapper.is-nitro { animation: car-nitro 2s cubic-bezier(.3,.7,.6,1); }

        /* 🎵 RAP - El coche se mueve como si bailara */
        @keyframes car-rap {
            0%   { transform: translateX(-50%) rotate(0deg)    translateY(0); }
            15%  { transform: translateX(-52%) rotate(-6deg)   translateY(-6px); }
            30%  { transform: translateX(-48%) rotate(6deg)    translateY(0); }
            45%  { transform: translateX(-52%) rotate(-6deg)   translateY(-6px); }
            60%  { transform: translateX(-48%) rotate(6deg)    translateY(0); }
            75%  { transform: translateX(-52%) rotate(-6deg)   translateY(-6px); }
            90%  { transform: translateX(-48%) rotate(6deg)    translateY(0); }
            100% { transform: translateX(-50%) rotate(0deg)    translateY(0); }
        }
        .car-wrapper.is-rap { animation: car-rap 1.6s ease-in-out infinite; }

        /* 🤸 STUNT - Backflip */
        @keyframes car-stunt {
            0%   { transform: translateX(-50%) translateY(0)     rotate(0deg); }
            15%  { transform: translateX(-50%) translateY(-25px) rotate(-60deg); }
            35%  { transform: translateX(-50%) translateY(-55px) rotate(-180deg); }
            55%  { transform: translateX(-50%) translateY(-55px) rotate(-300deg); }
            80%  { transform: translateX(-50%) translateY(-15px) rotate(-350deg); }
            100% { transform: translateX(-50%) translateY(0)     rotate(-360deg); }
        }
        .car-wrapper.is-stunt { animation: car-stunt 1.1s cubic-bezier(.5,.05,.5,.95) forwards; }

        /* 💨 HYDRAULICS - El coche salta arriba y abajo como lowrider */
        @keyframes car-hydro {
            0%   { transform: translateX(-50%) rotate(0deg)   translateY(0); }
            10%  { transform: translateX(-50%) rotate(-4deg)  translateY(-18px); }
            20%  { transform: translateX(-50%) rotate(4deg)   translateY(0); }
            30%  { transform: translateX(-50%) rotate(-5deg)  translateY(-22px); }
            40%  { transform: translateX(-50%) rotate(5deg)   translateY(0); }
            50%  { transform: translateX(-50%) rotate(-4deg)  translateY(-20px); }
            60%  { transform: translateX(-50%) rotate(4deg)   translateY(0); }
            70%  { transform: translateX(-50%) rotate(-6deg)  translateY(-15px); }
            80%  { transform: translateX(-50%) rotate(6deg)   translateY(0); }
            90%  { transform: translateX(-50%) rotate(-3deg)  translateY(-10px); }
            100% { transform: translateX(-50%) rotate(0deg)   translateY(0); }
        }
        .car-wrapper.is-hydro { animation: car-hydro 1.5s ease-in-out infinite; }

        /* 💨 Humo de drift */
        .smoke {
            position: absolute;
            bottom: 12%;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(200,200,200,0.6) 40%, transparent 75%);
            border-radius: 50%;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
        }
        .smoke.left  { left: 22%; }
        .smoke.right { right: 22%; }
        @keyframes smoke-puff-left {
            0%   { opacity: 0.9; transform: translate(0, 0) scale(0.4); }
            100% { opacity: 0; transform: translate(-40px, -35px) scale(2.2); }
        }
        @keyframes smoke-puff-right {
            0%   { opacity: 0.9; transform: translate(0, 0) scale(0.4); }
            100% { opacity: 0; transform: translate(40px, -35px) scale(2.2); }
        }
        .smoke.left.active  { animation: smoke-puff-left 1.4s ease-out; }
        .smoke.right.active { animation: smoke-puff-right 1.4s ease-out; }

        /* 🔥 Llamas de nitro */
        .flame {
            position: absolute;
            bottom: 18%;
            left: 15%;
            width: 60px;
            height: 30px;
            background: radial-gradient(ellipse at right, #fff 0%, #ffd700 20%, #ff6600 50%, #ff3300 80%, transparent 100%);
            border-radius: 50% 20% 20% 50%;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            filter: blur(2px);
        }
        @keyframes flame-flicker {
            0%, 100% { opacity: 1; transform: scaleX(1)   scaleY(1); }
            50%      { opacity: 0.7; transform: scaleX(1.4) scaleY(0.8); }
        }
        .flame.active { animation: flame-flicker 0.1s linear infinite; opacity: 1; }

        /* 🎵 Notas musicales */
        .note {
            position: absolute;
            font-size: 24px;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            user-select: none;
        }
        .note.n1 { left: 20%; bottom: 40%; }
        .note.n2 { left: 40%; bottom: 50%; }
        .note.n3 { left: 60%; bottom: 45%; }
        .note.n4 { left: 75%; bottom: 35%; }
        @keyframes note-float {
            0%   { opacity: 0; transform: translateY(0)     scale(0.5) rotate(0deg); }
            20%  { opacity: 1; }
            100% { opacity: 0; transform: translateY(-80px) scale(1.2) rotate(30deg); }
        }
        .note.active { animation: note-float 1.6s ease-out infinite; }
        .note.n2.active { animation-delay: 0.3s; }
        .note.n3.active { animation-delay: 0.6s; }
        .note.n4.active { animation-delay: 0.9s; }

        /* Marcas de neumático */
        @keyframes skid-fade {
            0%   { opacity: 0.9; }
            100% { opacity: 0; }
        }
        .skid-marks {
            position: absolute;
            bottom: 14%;
            left: 20%;
            right: 20%;
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                rgba(0,0,0,0.6) 0 8px,
                transparent 8px 14px
            );
            border-radius: 4px;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
        }
        .skid-marks.active { animation: skid-fade 2s ease-out; }

        menu {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            margin: 14px 0 0;
            padding: 0;
            list-style: none;
            width: 100%;
        }
        menu button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 7px 2px;
            border-radius: 10px;
            font-size: .58rem;
            font-weight: 700;
            border: 1px solid var(--box-border);
            background: var(--box-bg);
            color: var(--ink);
            cursor: pointer;
            transition: transform .18s ease, border-color .25s ease, background .25s ease;
        }
        menu button:hover { transform: translateY(-1px); border-color: var(--accent); }
        menu button svg { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        menu button.active { background: var(--active-bg); border-color: var(--active-border); }
        menu button.active svg { stroke: var(--accent); }
        menu button.power svg { stroke: #d32f2f; }
        menu button.power:hover { border-color: #d32f2f; }
        menu button.alarm svg { stroke: #f5a623; }
        menu button.alarm:hover { border-color: #f5a623; }
        menu button.drift svg { stroke: #00c2ff; }
        menu button.drift:hover { border-color: #00c2ff; }
        menu button.nitro svg { stroke: #ff4500; }
        menu button.nitro:hover { border-color: #ff4500; }
        menu button.rap svg { stroke: #9c27b0; }
        menu button.rap:hover { border-color: #9c27b0; }
        menu button.stunt svg { stroke: #4caf50; }
        menu button.stunt:hover { border-color: #4caf50; }
        menu button.hydro svg { stroke: #00bcd4; }
        menu button.hydro:hover { border-color: #00bcd4; }

        .log-box {
            margin-top: 12px;
            padding: 8px 10px;
            border-radius: 10px;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            font-size: .68rem;
            color: var(--ink-soft);
            min-height: 18px;
        }

        /* 🔥 KILL SWITCH (solo para el coche) */
        .car-wrapper,
        .car-wrapper *,
        .car-img,
        #carImg {
            mask: none !important;
            -webkit-mask: none !important;
            mask-image: none !important;
            -webkit-mask-image: none !important;
            clip-path: none !important;
            -webkit-clip-path: none !important;
            box-shadow: none !important;
            text-shadow: none !important;
            mix-blend-mode: normal !important;
            outline: none !important;
            border: none !important;
        }
    </style>
</head>
<body>
    <a class="btn-home" href="index.html" aria-label="Home">
        <svg class="SVGBGI" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path class="accent" fill="#bb0a30" d="M12 20V4l-8 8 8 8z"></path><path class="solid" fill="#13171a" d="m1.58 13.42 8 8a2 2 0 0 0 2.83-2.83L7.82 14h13.17c1.1 0 2-.9 2-2s-.9-2-2-2H7.83l4.59-4.59a2 2 0 0 0-1.41-3.42 2 2 0 0 0-1.41.59l-8.02 8a2.01 2.01 0 0 0 0 2.83Z"></path></svg>
    </a>
    <main>
        <header style="text-align:center;margin-top:20px">
            <h1>07-Vehicle - Class</h1>
            <h2>A Vehicle class models each car: its data (brand, model, year, color, top speed) and its behavior (turn on/off, accelerate, brake, reverse, honk).</h2>
        </header>
        <section>
            <div id="vehicle">
                <header>
                    <div class="logo" aria-label="Audi Logo"></div>
                    <button class="mode" id="modeToggle" aria-label="Toggle dark/light mode">
                        <svg id="modeIcon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4.5"></circle>
                            <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path>
                        </svg>
                        <span>MODE</span>
                    </button>
                </header>

                <nav class="selector">
                    <button class="nav-arrow" id="prevBtn" aria-label="Previous car">
                        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
                        <span>Prev</span>
                    </button>
                    <div class="brand" id="brandName">Audi</div>
                    <button class="nav-arrow" id="nextBtn" aria-label="Next car">
                        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                        <span>next</span>
                    </button>
                </nav>

                <div class="specs">
                    <div class="spec-box">
                        <div class="spec-head">
                            <p class="spec-label">Model</p>
                            <svg viewBox="0 0 24 24">
                                <path d="M5 17h14M5 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm14 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/>
                                <path d="M5 17l2-7h10l2 7"/>
                                <path d="M9 10V7h6v3"/>
                            </svg>
                        </div>
                        <p class="spec-value" id="specModel">R8</p>
                    </div>
                    <div class="spec-box">
                        <div class="spec-head">
                            <p class="spec-label">Refer</p>
                            <svg viewBox="0 0 24 24">
                                <path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 1 5.4-5.4l-2.5 2.5 1.5 1.5 2.5-2.5z"/>
                            </svg>
                        </div>
                        <p class="spec-value" id="specYear">2024</p>
                    </div>
                    <div class="spec-box">
                        <div class="spec-head">
                            <p class="spec-label">Color</p>
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.56-2.5 5.56-5.55C21.97 6.01 17.46 2 12 2z"/>
                                <circle cx="13.5" cy="6.5" r=".8" fill="currentColor"/>
                                <circle cx="17.5" cy="10.5" r=".8" fill="currentColor"/>
                                <circle cx="8.5" cy="7.5" r=".8" fill="currentColor"/>
                                <circle cx="6.5" cy="12.5" r=".8" fill="currentColor"/>
                            </svg>
                        </div>
                        <p class="spec-value" id="specColor">White</p>
                    </div>
                </div>

                <div class="scene-container" id="scene">
                    <div class="road"></div>
                    <div class="skid-marks" id="skidMarks"></div>
                    <div class="smoke left"  id="smokeLeft"></div>
                    <div class="smoke right" id="smokeRight"></div>
                    <div class="flame" id="flame"></div>
                    <div class="note n1" id="note1">🎵</div>
                    <div class="note n2" id="note2">🎶</div>
                    <div class="note n3" id="note3">🎵</div>
                    <div class="note n4" id="note4">🎶</div>
                    <div class="car-wrapper" id="carWrapper">
                        <img class="car-img" id="carImg" src="" alt="Selected car">
                    </div>
                </div>

                <menu>
                    <button id="menuOn" title="Turn on engine">
                        <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4z"/></svg>
                        <span>On</span>
                    </button>

    </main>

    <script>
        class Vehicle {
            constructor(brand, model, year, color, topSpeed, img, engineType) {
                this.brand = brand;
                this.model = model;
                this.year = year;
                this.color = color;
                this.topSpeed = topSpeed;
                this.img = img;
                this.engineType = engineType;
                this.engineOn = false;
                this.speed = 0;
                this.direction = 'stopped';
            }
            turnOn() { this.engineOn = true; this.speed = 0; this.direction = 'idle'; return `${this.brand} ${this.model} engine started.`; }
            turnOff() { this.engineOn = false; this.speed = 0; this.direction = 'stopped'; return `${this.brand} ${this.model} engine turned off.`; }
            accelerate() { if (!this.engineOn) return `Turn the engine on first.`; this.direction = 'forward'; this.speed = this.topSpeed; return `${this.model} accelerating forward.`; }
            reverse() { if (!this.engineOn) return `Turn the engine on first.`; this.direction = 'reverse'; this.speed = Math.round(this.topSpeed * 0.5); return `${this.model} reversing.`; }
            brake() { if (!this.engineOn) return `Engine is already off.`; this.direction = 'idle'; this.speed = 0; return `${this.model} braking to a stop.`; }
            alarm() { return `🚨 ${this.model}: ALARM! WEE-WOO WEE-WOO 🚨`; }
            drift() { return `🏎️ ${this.model}: ¡DRIFT MODE! NEEEUM NEEEUM 💨`; }
            nitro() { return `🔥 ${this.model}: ¡NITRO ACTIVADO! VROOOOM 🔥`; }
            rap() { return `🎵 ${this.model}: ¡MODO RAP! Yo soy el más duro del garage 🎤`; }
            stunt() { return `🤸 ${this.model}: ¡STUNT 360°! YEEEEHAW! 🤸`; }
            hydro() { return `💨 ${this.model}: ¡HYDRAULICS! BOING BOING 💨`; }
            describe() { return `${this.year} ${this.brand} ${this.model} (${this.color})`; }
        }

        const fleet = [
            new Vehicle('Audi', 'R8',    2024, 'Glacier White',  330, './src/css/imgs/audi-r8.png',    'brutal'),
            new Vehicle('Audi', 'RS3',   2024, 'Nardo Grey',     290, './src/css/imgs/audi-rs3.png',   'normal'),
            new Vehicle('Audi', 'RS7',   2024, 'District Green', 305, './src/css/imgs/audi-rs7.png',   'brutal'),
            new Vehicle('Audi', 'TT RS', 2024, 'Sepang Blue',    280, './src/css/imgs/audi-tt.png',    'normal'),
            new Vehicle('Audi', 'RS Q8', 2024, 'Daytona Grey',   250, './src/css/imgs/audi-rsq8.png',  'brutal')
        ];

        let current = 0;

        const vhc = document.getElementById('vehicle');
        const modeToggle = document.getElementById('modeToggle');
        const modeIcon = document.getElementById('modeIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const brandName = document.getElementById('brandName');
        const specModel = document.getElementById('specModel');
        const specYear = document.getElementById('specYear');
        const specColor = document.getElementById('specColor');
        const carWrapper = document.getElementById('carWrapper');
        const carImg = document.getElementById('carImg');
        const scene = document.getElementById('scene');
        const logBox = document.getElementById('logBox');
        const smokeLeft = document.getElementById('smokeLeft');
        const smokeRight = document.getElementById('smokeRight');
        const skidMarks = document.getElementById('skidMarks');
        const flame = document.getElementById('flame');
        const note1 = document.getElementById('note1');
        const note2 = document.getElementById('note2');
        const note3 = document.getElementById('note3');
        const note4 = document.getElementById('note4');

        const menuOn = document.getElementById('menuOn');
        const menuOff = document.getElementById('menuOff');
        const menuForward = document.getElementById('menuForward');
        const menuReverse = document.getElementById('menuReverse');
        const menuStop = document.getElementById('menuStop');
        const menuAlarm = document.getElementById('menuAlarm');
        const menuDrift = document.getElementById('menuDrift');
        const menuNitro = document.getElementById('menuNitro');
        const menuRap = document.getElementById('menuRap');
        const menuStunt = document.getElementById('menuStunt');
        const menuHydro = document.getElementById('menuHydro');

        let audioCtx = null;
        let engineNodes = null;
        let masterGain = null;
        let alarmPlaying = false;
        let actionPlaying = false;

        function ctx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.5;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        /* ================= MOTOR ================= */
        function startEngineHum(type) {
            stopEngineHum();
            const c = ctx();
            const osc1 = c.createOscillator();
            const osc2 = c.createOscillator();
            const subOsc = c.createOscillator();

            const noiseBuffer = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
            const noiseData = noiseBuffer.getChannelData(0);
            for (let i = 0; i < noiseData.length; i++) noiseData[i] = Math.random() * 2 - 1;
            const noise = c.createBufferSource();
            noise.buffer = noiseBuffer;
            noise.loop = true;

            const filter = c.createBiquadFilter();
            filter.type = 'lowpass';
            filter.Q.value = 3;

            const gain = c.createGain();
            gain.gain.value = 0;

            const noiseGain = c.createGain();

            if (type === 'brutal') {
                osc1.type = 'sawtooth'; osc1.frequency.value = 38;
                osc2.type = 'square';   osc2.frequency.value = 76;
                subOsc.type = 'sine';   subOsc.frequency.value = 19;
                filter.frequency.value = 600;
                noiseGain.gain.value = 0.02;
                gain.gain.linearRampToValueAtTime(0.12, c.currentTime + 0.4);
            } else {
                osc1.type = 'sawtooth'; osc1.frequency.value = 55;
                osc2.type = 'sine';     osc2.frequency.value = 110;
                subOsc.type = 'sine';   subOsc.frequency.value = 27;
                filter.frequency.value = 1200;
                noiseGain.gain.value = 0.01;
                gain.gain.linearRampToValueAtTime(0.07, c.currentTime + 0.3);
            }

            noise.connect(noiseGain);
            noiseGain.connect(filter);
            osc1.connect(filter);
            osc2.connect(filter);
            subOsc.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);

            osc1.start(); osc2.start(); subOsc.start(); noise.start();
            engineNodes = { osc1, osc2, subOsc, noise, gain, filter, noiseGain, type };
        }

        function setEngineRate(freq) {
            if (!engineNodes) return;
            const c = ctx();
            const t = c.currentTime;
            const isBrutal = engineNodes.type === 'brutal';
            const baseFreq = isBrutal ? freq * 0.7 : freq;
            engineNodes.osc1.frequency.setTargetAtTime(baseFreq, t, 0.15);
            engineNodes.osc2.frequency.setTargetAtTime(baseFreq * 2, t, 0.15);
            engineNodes.subOsc.frequency.setTargetAtTime(baseFreq * 0.5, t, 0.15);
            engineNodes.filter.frequency.setTargetAtTime(isBrutal ? 400 + baseFreq * 3 : 600 + baseFreq * 5, t, 0.15);
            engineNodes.gain.gain.setTargetAtTime(isBrutal ? 0.15 : 0.09, t, 0.2);
        }

        function stopEngineHum() {
            if (engineNodes) {
                const c = ctx();
                const t = c.currentTime;
                try { engineNodes.gain.gain.setTargetAtTime(0, t, 0.1); } catch(e) {}
                const nodes = engineNodes;
                setTimeout(() => {
                    try { nodes.osc1.stop(); } catch(e) {}
                    try { nodes.osc2.stop(); } catch(e) {}
                    try { nodes.subOsc.stop(); } catch(e) {}
                    try { nodes.noise.stop(); } catch(e) {}
                    nodes.osc1.disconnect(); nodes.osc2.disconnect();
                    nodes.subOsc.disconnect(); nodes.noise.disconnect();
                    nodes.gain.disconnect(); nodes.filter.disconnect(); nodes.noiseGain.disconnect();
                }, 150);
                engineNodes = null;
            }
        }

        /* ================= 🚨 ALARMA ================= */
        function playAlarm() {
            if (alarmPlaying) return;
            alarmPlaying = true;
            const c = ctx();
            const t = c.currentTime;
            const totalTime = 4;
            const cycles = 6;
            const cycleTime = totalTime / cycles;

            const alarmGain = c.createGain();
            alarmGain.gain.value = 0.25;
            alarmGain.connect(masterGain);

            for (let i = 0; i < cycles; i++) {
                const startTime = t + i * cycleTime;
                const osc = c.createOscillator();
                const localGain = c.createGain();
                osc.type = 'square';
                const freq = (i % 2 === 0) ? 700 : 950;
                osc.frequency.value = freq;

                localGain.gain.setValueAtTime(0, startTime);
                localGain.gain.linearRampToValueAtTime(1, startTime + 0.02);
                localGain.gain.setValueAtTime(1, startTime + cycleTime * 0.8);
                localGain.gain.linearRampToValueAtTime(0, startTime + cycleTime);

                osc.connect(localGain);
                localGain.connect(alarmGain);
                osc.start(startTime);
                osc.stop(startTime + cycleTime);
            }

            setTimeout(() => { alarmPlaying = false; alarmGain.disconnect(); }, totalTime * 1000);
        }

        /* ================= 🏎️ DRIFT - Chirrido + motor ================= */
        function playDrift() {
            if (actionPlaying) return;
            actionPlaying = true;
            const c = ctx();
            const t = c.currentTime;

            const noiseBuffer = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
            const noiseData = noiseBuffer.getChannelData(0);
            for (let i = 0; i < noiseData.length; i++) noiseData[i] = Math.random() * 2 - 1;
            const noise = c.createBufferSource();
            noise.buffer = noiseBuffer;
            noise.loop = true;

            const noiseFilter = c.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.value = 3000;
            noiseFilter.Q.value = 8;

            const noiseGain = c.createGain();
            noiseGain.gain.setValueAtTime(0, t);
            noiseGain.gain.linearRampToValueAtTime(0.12, t + 0.1);
            noiseGain.gain.setValueAtTime(0.12, t + 2.0);
            noiseGain.gain.linearRampToValueAtTime(0, t + 2.2);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(masterGain);
            noise.start(t);
            noise.stop(t + 2.3);

            const motorOsc1 = c.createOscillator();
            const motorOsc2 = c.createOscillator();
            const motorFilter = c.createBiquadFilter();
            const motorGain = c.createGain();

            motorOsc1.type = 'sawtooth';
            motorOsc2.type = 'square';
            motorOsc1.frequency.setValueAtTime(90, t);
            motorOsc2.frequency.setValueAtTime(180, t);
            for (let i = 0; i < 4; i++) {
                motorOsc1.frequency.linearRampToValueAtTime(180, t + 0.3 + i * 0.5);
                motorOsc2.frequency.linearRampToValueAtTime(360, t + 0.3 + i * 0.5);
                motorOsc1.frequency.linearRampToValueAtTime(100, t + 0.5 + i * 0.5);
                motorOsc2.frequency.linearRampToValueAtTime(200, t + 0.5 + i * 0.5);
            }
            motorFilter.type = 'lowpass';
            motorFilter.frequency.value = 900;
            motorGain.gain.setValueAtTime(0, t);
            motorGain.gain.linearRampToValueAtTime(0.1, t + 0.1);
            motorGain.gain.setValueAtTime(0.1, t + 2.0);
            motorGain.gain.linearRampToValueAtTime(0, t + 2.2);

            motorOsc1.connect(motorFilter);
            motorOsc2.connect(motorFilter);
            motorFilter.connect(motorGain);
            motorGain.connect(masterGain);
            motorOsc1.start(t);
            motorOsc2.start(t);
            motorOsc1.stop(t + 2.3);
            motorOsc2.stop(t + 2.3);

            setTimeout(() => { actionPlaying = false; }, 2400);
        }

        /* ================= 🔥 NITRO - Whoosh + boom ================= */
        function playNitro() {
            if (actionPlaying) return;
            actionPlaying = true;
            const c = ctx();
            const t = c.currentTime;

            // Whoosh
            const osc = c.createOscillator();
            const gain = c.createGain();
            const filter = c.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(60, t);
            osc.frequency.exponentialRampToValueAtTime(400, t + 0.4);
            osc.frequency.exponentialRampToValueAtTime(80, t + 1.8);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(300, t);
            filter.frequency.exponentialRampToValueAtTime(2500, t + 0.4);
            filter.frequency.exponentialRampToValueAtTime(400, t + 1.8);

            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.2, t + 0.1);
            gain.gain.setValueAtTime(0.2, t + 1.6);
            gain.gain.linearRampToValueAtTime(0, t + 1.9);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            osc.start(t);
            osc.stop(t + 2);

            // Boom al final
            const boom = c.createOscillator();
            const boomGain = c.createGain();
            boom.type = 'square';
            boom.frequency.setValueAtTime(120, t + 1.5);
            boom.frequency.exponentialRampToValueAtTime(40, t + 1.9);
            boomGain.gain.setValueAtTime(0, t + 1.5);
            boomGain.gain.linearRampToValueAtTime(0.25, t + 1.55);
            boomGain.gain.exponentialRampToValueAtTime(0.001, t + 2);
            boom.connect(boomGain);
            boomGain.connect(masterGain);
            boom.start(t + 1.5);
            boom.stop(t + 2.1);

            setTimeout(() => { actionPlaying = false; }, 2200);
        }

        /* ================= 🎵 RAP - Beat tipo hip-hop ================= */
        function playRap() {
            if (actionPlaying) return;
            actionPlaying = true;
            const c = ctx();
            const t = c.currentTime;

            // Kick drum (cada 0.4s)
            for (let i = 0; i < 8; i++) {
                const startTime = t + i * 0.4;
                const kick = c.createOscillator();
                const kickGain = c.createGain();
                kick.type = 'sine';
                kick.frequency.setValueAtTime(150, startTime);
                kick.frequency.exponentialRampToValueAtTime(40, startTime + 0.1);
                kickGain.gain.setValueAtTime(0.3, startTime);
                kickGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.15);
                kick.connect(kickGain);
                kickGain.connect(masterGain);
                kick.start(startTime);
                kick.stop(startTime + 0.2);
            }

            // Hi-hat (cada 0.2s)
            for (let i = 0; i < 16; i++) {
                const startTime = t + i * 0.2;
                const hat = c.createOscillator();
                const hatGain = c.createGain();
                const hatFilter = c.createBiquadFilter();
                hat.type = 'square';
                hat.frequency.value = 8000;
                hatFilter.type = 'highpass';
                hatFilter.frequency.value = 6000;
                hatGain.gain.setValueAtTime(0.05, startTime);
                hatGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.05);
                hat.connect(hatFilter);
                hatFilter.connect(hatGain);
                hatGain.connect(masterGain);
                hat.start(startTime);
                hat.stop(startTime + 0.1);
            }

            setTimeout(() => { actionPlaying = false; }, 3400);
        }

        /* ================= 🤸 STUNT - Whoosh + YEEHAW ================= */
        function playStunt() {
            if (actionPlaying) return;
            actionPlaying = true;
            const c = ctx();
            const t = c.currentTime;

            const osc = c.createOscillator();
            const gain = c.createGain();
            const filter = c.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(80, t);
            osc.frequency.exponentialRampToValueAtTime(600, t + 0.5);
            osc.frequency.exponentialRampToValueAtTime(80, t + 1.0);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(400, t);
            filter.frequency.exponentialRampToValueAtTime(2000, t + 0.5);
            filter.frequency.exponentialRampToValueAtTime(400, t + 1.0);

            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.15, t + 0.1);
            gain.gain.setValueAtTime(0.15, t + 0.9);
            gain.gain.linearRampToValueAtTime(0, t + 1.1);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            osc.start(t);
            osc.stop(t + 1.2);

            const osc2 = c.createOscillator();
            const gain2 = c.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(880, t + 1.0);
            osc2.frequency.exponentialRampToValueAtTime(1400, t + 1.3);
            gain2.gain.setValueAtTime(0, t + 1.0);
            gain2.gain.linearRampToValueAtTime(0.2, t + 1.05);
            gain2.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
            osc2.connect(gain2);
            gain2.connect(masterGain);
            osc2.start(t + 1.0);
            osc2.stop(t + 1.5);

            setTimeout(() => { actionPlaying = false; }, 1600);
        }

        /* ================= 💨 HYDRO - Boing boing ================= */
        function playHydro() {
            if (actionPlaying) return;
            actionPlaying = true;
            const c = ctx();
            const t = c.currentTime;

            // 5 "boings"
            for (let i = 0; i < 5; i++) {
                const startTime = t + i * 0.3;
                const osc = c.createOscillator();
                const gain = c.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, startTime);
                osc.frequency.exponentialRampToValueAtTime(800, startTime + 0.15);
                osc.frequency.exponentialRampToValueAtTime(150, startTime + 0.25);
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.25, startTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.28);
                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(startTime);
                osc.stop(startTime + 0.3);
            }

            setTimeout(() => { actionPlaying = false; }, 1700);
        }

        function log(msg) { logBox.textContent = msg; }
        function setActive(btn) {
            [menuOn, menuForward, menuStop, menuReverse, menuAlarm, menuDrift, menuNitro, menuRap, menuStunt, menuHydro, menuOff].forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }
        function clearSceneState() {
            scene.classList.remove('is-forward', 'is-back');
            carWrapper.classList.remove('is-running', 'is-reverse', 'is-starting', 'is-alarm', 'is-drift', 'is-nitro', 'is-rap', 'is-stunt', 'is-hydro');
            carImg.classList.remove('is-alarm');
            smokeLeft.classList.remove('active');
            smokeRight.classList.remove('active');
            skidMarks.classList.remove('active');
            flame.classList.remove('active');
            [note1, note2, note3, note4].forEach(n => n.classList.remove('active'));
        }

        function render() {
            const v = fleet[current];
            brandName.textContent = v.brand;
            specModel.textContent = v.model;
            specYear.textContent = v.year;
            specColor.textContent = v.color;
            carImg.src = v.img;
            carImg.alt = v.describe();
            clearSceneState();
            setActive(v.engineOn ? menuOn : null);
            log(`Selected: ${v.describe()}. Top speed ${v.topSpeed} km/h.`);
        }

        /* ---------- Botones ---------- */
        menuOn.addEventListener('click', () => {
            const v = fleet[current];
            log(v.turnOn());
            clearSceneState();
            startEngineHum(v.engineType);
            carWrapper.classList.add('is-starting');
            setTimeout(() => carWrapper.classList.remove('is-starting'), 800);
            setActive(menuOn);
        });

        menuOff.addEventListener('click', () => {
            const v = fleet[current];
            log(v.turnOff());
            clearSceneState();
            stopEngineHum();
            setActive(menuOff);
        });

        menuForward.addEventListener('click', () => {
            const v = fleet[current];
            log(v.accelerate());
            if (v.engineOn) {
                clearSceneState();
                scene.classList.add('is-forward');
                carWrapper.classList.add('is-running');
                setEngineRate(v.engineType === 'brutal' ? 120 : 150);
                setActive(menuForward);
            }
        });

        menuReverse.addEventListener('click', () => {
            const v = fleet[current];
            log(v.reverse());
            if (v.engineOn) {
                clearSceneState();
                scene.classList.add('is-back');
                carWrapper.classList.add('is-running', 'is-reverse');
                setEngineRate(70);
                setActive(menuReverse);
            }
        });

        menuStop.addEventListener('click', () => {
            const v = fleet[current];
            log(v.brake());
            clearSceneState();
            if (v.engineOn) setEngineRate(50);
            setActive(v.engineOn ? menuStop : menuOff);
        });

        menuAlarm.addEventListener('click', () => {
            const v = fleet[current];
            log(v.alarm());
            playAlarm();
            clearSceneState();
            carWrapper.classList.add('is-alarm');
            carImg.classList.add('is-alarm');
            setActive(menuAlarm);
            setTimeout(() => {
                carWrapper.classList.remove('is-alarm');
                carImg.classList.remove('is-alarm');
                if (v.engineOn) setActive(menuOn); else setActive(null);
            }, 4000);
        });

        menuDrift.addEventListener('click', () => {
            const v = fleet[current];
            log(v.drift());
            playDrift();
            clearSceneState();
            carWrapper.classList.add('is-drift');
            setActive(menuDrift);
            setTimeout(() => {
                smokeLeft.classList.add('active');
                smokeRight.classList.add('active');
                skidMarks.classList.add('active');
                setTimeout(() => {
                    smokeLeft.classList.remove('active');
                    smokeRight.classList.remove('active');
                }, 1400);
                setTimeout(() => skidMarks.classList.remove('active'), 2000);
            }, 200);
            setTimeout(() => {
                carWrapper.classList.remove('is-drift');
                if (v.engineOn) setActive(menuOn); else setActive(null);
            }, 2300);
        });

        menuNitro.addEventListener('click', () => {
            const v = fleet[current];
            log(v.nitro());
            playNitro();
            clearSceneState();
            carWrapper.classList.add('is-nitro');
            setActive(menuNitro);
            setTimeout(() => {
                flame.classList.add('active');
                setTimeout(() => flame.classList.remove('active'), 1900);
            }, 200);
            setTimeout(() => {
                carWrapper.classList.remove('is-nitro');
                if (v.engineOn) setActive(menuOn); else setActive(null);
            }, 2000);
        });

        menuRap.addEventListener('click', () => {
            const v = fleet[current];
            log(v.rap());
            playRap();
            clearSceneState();
            carWrapper.classList.add('is-rap');
            [note1, note2, note3, note4].forEach(n => n.classList.add('active'));
            setActive(menuRap);
            setTimeout(() => {
                carWrapper.classList.remove('is-rap');
                [note1, note2, note3, note4].forEach(n => n.classList.remove('active'));
                if (v.engineOn) setActive(menuOn); else setActive(null);
            }, 3400);
        });

        menuStunt.addEventListener('click', () => {
            const v = fleet[current];
            log(v.stunt());
            playStunt();
            clearSceneState();
            carWrapper.classList.add('is-stunt');
            setActive(menuStunt);
            setTimeout(() => {
                smokeLeft.classList.add('active');
                smokeRight.classList.add('active');
                setTimeout(() => {
                    smokeLeft.classList.remove('active');
                    smokeRight.classList.remove('active');
                }, 1400);
            }, 900);
            setTimeout(() => {
                carWrapper.classList.remove('is-stunt');
                if (v.engineOn) setActive(menuOn); else setActive(null);
            }, 1300);
        });

        menuHydro.addEventListener('click', () => {
            const v = fleet[current];
            log(v.hydro());
            playHydro();
            clearSceneState();
            carWrapper.classList.add('is-hydro');
            setActive(menuHydro);
            setTimeout(() => {
                carWrapper.classList.remove('is-hydro');
                if (v.engineOn) setActive(menuOn); else setActive(null);
            }, 3200);
        });

        prevBtn.addEventListener('click', () => {
            fleet[current].turnOff();
            stopEngineHum();
            current = (current - 1 + fleet.length) % fleet.length;
            render();
        });

        nextBtn.addEventListener('click', () => {
            fleet[current].turnOff();
            stopEngineHum();
            current = (current + 1) % fleet.length;
            render();
        });

        function setTheme(isDark) {
            vhc.classList.toggle('dark', isDark);
            modeIcon.innerHTML = isDark
                ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor" stroke="none"></path>'
                : '<circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path>';
        }
        const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
        setTheme(darkQuery.matches);
        darkQuery.addEventListener('change', e => setTheme(e.matches));
        modeToggle.addEventListener('click', () => setTheme(!vhc.classList.contains('dark')));

        render();
    </script>
</body>
</html>
