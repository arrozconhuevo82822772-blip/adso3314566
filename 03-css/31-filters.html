<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31-filters</title>
    <link rel="stylesheet" href="../src/css/03-css.css">
    <style>
        .caja-negra-individual {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .caja-negra-individual h3 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .caja-blur img {
            filter: blur(5px);
            transition: filter 0.5s ease;
        }

        .caja-blur img:hover {
            filter: none;
        }

        .caja-brightness img {
            filter: brightness(2);
            transition: filter 0.5s ease;
        }

        .caja-brightness img:hover {
            filter: none;
        }

        .caja-sepia img {
            filter: sepia();
            transition: filter 0.5s ease;
        }

        .caja-sepia img:hover {
            filter: none;
        }

        .caja-contrast img {
            filter: contrast(2);
            transition: filter 0.5s ease;
        }

        .caja-contrast img:hover {
            filter: none;
        }

        .caja-invert img {
            filter: invert();
            transition: filter 0.5s ease;
        }

        .caja-invert img:hover {
            filter: none;
        }

        .caja-saturate img {
            filter: saturate(2);
            transition: filter 0.5s ease;
        }

        .caja-saturate img:hover {
            filter: none;
        }
    </style>
</head>
<body>
    <a class="btn-home" href="index.html">
        <svg class="SVGBGI" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path class="accent" d="M12 20V4l-8 8 8 8z"></path><path class="outline" d="m2.29,12.71l8,8c.39.39,1.02.39,1.41,0s.39-1.02,0-1.41l-6.29-6.29h15.59c.55,0,1-.45,1-1s-.45-1-1-1H5.41l6.29-6.29c.39-.39.39-1.02,0-1.41-.2-.2-.45-.29-.71-.29s-.51.1-.71.29L2.29,11.29c-.39.39-.39,1.02,0,1.41Z"></path><path class="solid" d="m1.58 13.42 8 8a2 2 0 0 0 2.83-2.83L7.82 14h13.17c1.1 0 2-.9 2-2s-.9-2-2-2H7.83l4.59-4.59a2 2 0 0 0-1.41-3.42 2 2 0 0 0-1.41.59l-8.02 8a2.01 2.01 0 0 0 0 2.83Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>31-Filters</h1>
            <h2>Description</h2>
        </header>
        <div class="caja-negra-individual">
                <h3>Normal</h3>
                <img src="../src/imgs/Profile_-_Marin_Kitagawa.webp" alt="Imagen normal">
            </div>

            <div class="caja-negra-individual caja-blur">
                <h3>Blur</h3>
                <img src="../src/imgs/Profile_-_Marin_Kitagawa.webp" alt="Imagen con blur">
            </div>

            <div class="caja-negra-individual caja-brightness">
                <h3>Brightness</h3>
                <img src="../src/imgs/Profile_-_Marin_Kitagawa.webp" alt="Imagen con brillo">
            </div>

            <div class="caja-negra-individual caja-sepia">
                <h3>Sepia</h3>
                <img src="../src/imgs/Profile_-_Marin_Kitagawa.webp" alt="Imagen sepia">
            </div>

            <div class="caja-negra-individual caja-contrast">
                <h3>Contrast</h3>
                <img src="../src/imgs/Profile_-_Marin_Kitagawa.webp" alt="Imagen con contraste">
            </div>

            <div class="caja-negra-individual caja-invert">
                <h3>Invert</h3>
                <img src="../src/imgs/Profile_-_Marin_Kitagawa.webp" alt="Imagen invertida">
            </div>

            <div class="caja-negra-individual caja-saturate">
                <h3>Saturate</h3>
                <img src="../src/imgs/Profile_-_Marin_Kitagawa.webp" alt="Imagen con saturación">
            </div>
    </main>
</body>
</html>
