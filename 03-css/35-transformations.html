<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>35-transformations</title>
    <link rel="stylesheet" href="../src/css/03-css.css">
    <style>
        .caja-negra-individual {
            text-align: center;
            transition: all 0.3s ease;
        }

        .caja-negra-individual h3 {
            border-bottom: none !important;
            padding-bottom: 10px !important;
            margin: 0 0 1rem 0 !important;
            display: inline-block !important;
            position: relative !important;
        }

        .caja-negra-individual h3::after {
            content: '' !important;
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 2px !important;
            background: linear-gradient(90deg, #bb4dff, #ff66cc, #ff00ff, #bb4dff) !important;
            background-size: 200% auto !important;
            border-radius: 2px !important;
            animation: neonLine 2s ease-in-out infinite, linePulse 1.5s ease-in-out infinite !important;
            display: block !important;
        }

        @keyframes neonLine {
            0% {
                background-position: 0% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        @keyframes linePulse {
            0%, 100% {
                box-shadow: 0 0 2px #bb4dff, 0 0 4px #ff66cc;
                height: 2px;
            }
            50% {
                box-shadow: 0 0 8px #bb4dff, 0 0 12px #ff66cc, 0 0 16px #ff00ff;
                height: 3px;
            }
        }

        .caja-negra-individual img {
            border-radius: 12px;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .caja-rotate img:hover {
            transform: rotate(20deg);
        }

        .caja-scale img:hover {
            transform: scale(1.2);
        }

        .caja-translate img:hover {
            transform: translateY(-20px);
        }

        .caja-skew img:hover {
            transform: skew(-10deg, 5deg);
        }

        .caja-combo img:hover {
            transform: rotate(-10deg) scale(1.15) translateY(-10px);
        }

    </style>
</head>
<body>
    <a class="btn-home" href="index.html">
        <svg class="SVGBGI" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path class="accent" d="M12 20V4l-8 8 8 8z"></path><path class="outline" d="m2.29,12.71l8,8c.39.39,1.02.39,1.41,0s.39-1.02,0-1.41l-6.29-6.29h15.59c.55,0,1-.45,1-1s-.45-1-1-1H5.41l6.29-6.29c.39-.39.39-1.02,0-1.41-.2-.2-.45-.29-.71-.29s-.51.1-.71.29L2.29,11.29c-.39.39-.39,1.02,0,1.41Z"></path><path class="solid" d="m1.58 13.42 8 8a2 2 0 0 0 2.83-2.83L7.82 14h13.17c1.1 0 2-.9 2-2s-.9-2-2-2H7.83l4.59-4.59a2 2 0 0 0-1.41-3.42 2 2 0 0 0-1.41.59l-8.02 8a2.01 2.01 0 0 0 0 2.83Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>35-Transformations</h1>
            <h2>Description</h2>
        </header>
        <section>
                <div class="contenedor-cards">

                <div class="caja-negra-individual caja-rotate">
                    <h3>Rotate</h3>
                    <img src="../src/imgs/Descarga_29.webp" alt="Rotate">
                </div>

                <div class="caja-negra-individual caja-scale">
                    <h3>Scale</h3>
                    <img src="../src/imgs/Descarga_29.webp" alt="Scale">
                </div>

                <div class="caja-negra-individual caja-translate">
                    <h3>Translate</h3>
                    <img src="../src/imgs/Descarga_29.webp" alt="Translate">
                </div>

                <div class="caja-negra-individual caja-skew">
                    <h3>Skew</h3>
                    <img src="../src/imgs/Descarga_29.webp" alt="Skew">
                </div>

                <div class="caja-negra-individual caja-combo">

                </div>
            </div>
    </main>
</body>
</html>
