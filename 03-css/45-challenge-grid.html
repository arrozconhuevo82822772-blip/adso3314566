<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-challenge-grid</title>
    <link rel="stylesheet" href="../src/css/03-css.css">
    <style>
        main section.grid-retos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 1fr 1fr 1.4fr;
            grid-template-areas:
                "a c d"
                "b c e"
                "f f g";
            gap: 10px;
            width: min(700px, 92vw);
            aspect-ratio: 3 / 2.4;
            margin: 40px auto;
        }

        .grid-retos img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border: 2px solid #cdd3ff;
            border-radius: 4px;
        }

        .area-a { grid-area: a; }
        .area-b { grid-area: b; }
        .area-c { grid-area: c; }
        .area-d { grid-area: d; }
        .area-e { grid-area: e; }
        .area-f { grid-area: f; }
        .area-g { grid-area: g; }
    </style>
</head>
<body>
    <a class="btn-home" href="index.html">
        <svg class="SVGBGI" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path class="accent" d="M12 20V4l-8 8 8 8z"></path><path class="outline" d="m2.29,12.71l8,8c.39.39,1.02.39,1.41,0s.39-1.02,0-1.41l-6.29-6.29h15.59c.55,0,1-.45,1-1s-.45-1-1-1H5.41l6.29-6.29c.39-.39.39-1.02,0-1.41-.2-.2-.45-.29-.71-.29s-.51.1-.71.29L2.29,11.29c-.39.39-.39,1.02,0,1.41Z"></path><path class="solid" d="m1.58 13.42 8 8a2 2 0 0 0 2.83-2.83L7.82 14h13.17c1.1 0 2-.9 2-2s-.9-2-2-2H7.83l4.59-4.59a2 2 0 0 0-1.41-3.42 2 2 0 0 0-1.41.59l-8.02 8a2.01 2.01 0 0 0 0 2.83Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>45-Challenge Grid</h1>
            <h2>Grid challenge combining areas, gaps and alignment</h2>
        </header>
        <section class="grid-retos">
            <img class="area-a" src="../src/imgs/random%201.jpg" alt="pollos colgados">
            <img class="area-b" src="../src/imgs/random%202.jpg" alt="bart disfrazado">
            <img class="area-c" src="../src/imgs/random%206.jpg" alt="benson chicle">
            <img class="area-d" src="../src/imgs/random%204.jpg" alt="teletubby abandonado">
            <img class="area-e" src="../src/imgs/random%205.jpg" alt="trikitracatelas">
            <img class="area-f" src="../src/imgs/random%203.jpg" alt="mario y luigi">
            <img class="area-g" src="../src/imgs/random.jpg" alt="osvaldo">
        </section>
    </main>
</body>
</html>
